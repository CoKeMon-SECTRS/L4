-- vim:ft=lua
-- Boot config for osswitch with eMMC/SDHCI block device logging

local L4 = require("L4")
local ld = L4.default_loader

local hw_desc_file = ""
if L4.Info.arch() == "arm64" or L4.Info.arch() == "arm" then
	hw_desc_file = "rom/hw_devices.io"
end

-- Start io service to provide hardware access
local vbus_sdhci = ld:new_channel()
ld:start({
	caps = {
		sigma0 = L4.Env.sigma0,
		icu = L4.Env.icu,
		iommu = L4.Env.iommu,
		sdhci = vbus_sdhci:svr(),
	},
	log = { "io", "red" },
}, "rom/io -vvvv " .. hw_desc_file .. " rom/vbus-sdhci.io")

-- Start eMMC driver, connected to io via vbus
-- GPT partition type GUID for Linux filesystem (0x8300 in gdisk)
local blk_svr = ld:new_channel()
ld:start({
	caps = {
		vbus = vbus_sdhci,
		disk1 = blk_svr:svr(),
	},
	log = { "emmc", "cyan" },
}, "rom/emmc-drv -vvvv --client disk1 --device 115715E5-F934-471E-9A9F-AEB7DE29A878")

-- Start osswitch with block device and SMC access
ld:start({
	caps = {
		arm_smc = L4.Env.arm_smc,
		sigma0 = L4.Env.sigma0,
		blk = blk_svr,
	},
	log = { "osswitch", "blue" },
}, "rom/osswitch")

-- vi:ft=lua

local L4 = require("L4")
local ld = L4.default_loader

local emmc_driver_params = "" .. "-vvvv " .. "--client svr --device 36c953c9-236a-4f3c-92d8-2249ca45bc60"

local hw_desc_file = ""
if L4.Info.arch() == "arm64" or L4.Info.arch() == "arm" then
	hw_desc_file = "rom/hw_devices.io"
end

local vbus_sdhci = ld:new_channel()
ld:start({
	caps = {
		sigma0 = L4.Env.sigma0,
		icu = L4.Env.icu,
		iommu = L4.Env.iommu,
		vbus_emmc1 = vbus_sdhci:svr(),
	},
}, "rom/io -vvvv " .. hw_desc_file .. " rom/vbus-rk.io")

local emmc_part1 = ld:new_channel()
ld:start({
	caps = {
		vbus = vbus_sdhci,
		svr = emmc_part1:svr(),
	},
	log = { "emmc", "cyan" },
}, "rom/emmc-drv " .. emmc_driver_params)

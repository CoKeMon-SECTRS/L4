-- vi:ft=lua

local L4 = require("L4")
local ld = L4.default_loader

local vbus_nvme = ld:new_channel()
ld:start({
	caps = {
		sigma0 = L4.Env.sigma0,
		icu = L4.Env.icu,
		iommu = L4.Env.iommu,
		nvmedrv = vbus_nvme:svr(),
	},
}, "rom/io -vvvv rom/hw_devices.io rom/vbus-rk.io")

local nvme_bus = ld:new_channel()
local nvme_cl = L4.default_loader:new_channel()
ld:start({
	caps = {
		vbus = vbus_nvme,
		svr = nvme_bus:svr(),
		cl = nvme_cl:svr(),
	},
	log = { "emmc", "cyan" },
}, "rom/nvme-drv -vvv --client cl --device A206FAD7-9DD0-4CA0-A03C-1630D4C157EB")
